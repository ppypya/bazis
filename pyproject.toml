[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-processing-service"
version = "0.1.0"
description = "Асинхронный сервис обработки платежей и доставки webhook"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "faststream[rabbit]>=0.6,<0.7",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "mypy>=2.4,<3"]

[project.scripts]
payments-consumer = "presentation.cli.consumer:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and/or RabbitMQ"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["src", "migrations"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
